<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Product Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--color-bg); display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .card { background: var(--color-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; transition: all 150ms var(--ease-out-quart); position: relative; }
  .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .img { aspect-ratio: 1; background: linear-gradient(135deg, #FAFAF7, #F1F5F9); display: flex; align-items: center; justify-content: center; font-size: 48px; }
  .info { padding: 14px; }
  .cat { font-size: 11px; font-weight: 600; color: var(--color-text-muted); letter-spacing: 0.04em; text-transform: uppercase; }
  .name { font-size: 15px; font-weight: 600; line-height: 1.3; margin: 4px 0 8px; color: var(--color-text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .price-row { display: flex; align-items: center; justify-content: space-between; }
  .price { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--color-text); }
  .strike { color: var(--color-text-subtle); text-decoration: line-through; font-size: 12px; font-weight: 400; margin-left: 4px; }
  .add { width: 36px; height: 36px; border-radius: 50%; background: var(--color-primary); color: #fff; border: none; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .badge { position: absolute; top: 10px; left: 10px; padding: 4px 10px; border-radius: var(--radius-pill); font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
  .badge-sale { background: var(--color-accent); color: var(--color-text); }
  .badge-bulk { background: var(--color-info-soft); color: var(--color-info); }
</style>
</head>
<body>
  <div class="card">
    <div class="badge badge-sale">−15%</div>
    <div class="img">🍚</div>
    <div class="info">
      <div class="cat">Rice</div>
      <div class="name">Premium jasmine rice, 25 kg sack</div>
      <div class="price-row">
        <div><span class="price" style="color: var(--color-accent-dark);">₱1,275</span><span class="strike">₱1,500</span></div>
        <button class="add" aria-label="Add"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="img">🫒</div>
    <div class="info">
      <div class="cat">Cooking oil</div>
      <div class="name">Extra-virgin olive oil, 1 L</div>
      <div class="price-row">
        <div><span class="price">₱459</span></div>
        <button class="add" aria-label="Add"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="badge badge-bulk">Bulk</div>
    <div class="img">🥫</div>
    <div class="info">
      <div class="cat">Canned goods</div>
      <div class="name">Sardines in tomato sauce — case of 24</div>
      <div class="price-row">
        <div><span class="price">₱720</span></div>
        <button class="add" aria-label="Add"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
    </div>
  </div>
</body>
</html>
