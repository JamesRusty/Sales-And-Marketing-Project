<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Logo</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--color-surface); display: grid; grid-template-columns: auto auto auto 1fr; gap: 32px; align-items: center; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .label { font-size: 11px; font-weight: 600; color: var(--color-text-muted); letter-spacing: 0.06em; text-transform: uppercase; }
  .wm { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 36px; color: var(--color-primary); letter-spacing: -0.02em; display: inline-flex; align-items: center; }
  .wm .leaf { color: var(--color-accent); margin: 0 -2px 0 -3px; font-size: 32px; }
  .mark { width: 56px; height: 56px; border-radius: 14px; background: var(--color-primary); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 32px; font-family: 'Inter', sans-serif; position: relative; }
  .mark::after { content: ''; position: absolute; top: 6px; right: 6px; width: 12px; height: 12px; background: var(--color-accent); border-radius: 50% 50% 50% 0; transform: rotate(-30deg); }
  .on-dark { background: var(--color-text); padding: 12px 18px; border-radius: 12px; }
  .on-dark .wm { color: #fff; }
</style>
</head>
<body>
  <div class="item"><span class="wm">Pantr<span class="leaf">í</span>a</span><span class="label">Wordmark</span></div>
  <div class="item"><div class="mark">P</div><span class="label">App icon</span></div>
  <div class="item on-dark"><span class="wm">Pantr<span class="leaf">í</span>a</span></div>
  <div class="item"><span class="label" style="text-align:center;">Wordmark<br>on dark</span></div>
</body>
</html>
