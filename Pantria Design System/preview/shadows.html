<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 32px; background: var(--color-bg); }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .box { width: 100%; height: 80px; background: var(--color-surface); border-radius: var(--radius-lg); }
  .name { font-size: 12px; font-weight: 600; color: var(--color-text); }
  .px { font-family: ui-monospace, monospace; font-size: 10px; color: var(--color-text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow: var(--shadow-xs);"></div><div class="name">xs</div></div>
    <div class="item"><div class="box" style="box-shadow: var(--shadow-sm);"></div><div class="name">sm — resting card</div></div>
    <div class="item"><div class="box" style="box-shadow: var(--shadow-md);"></div><div class="name">md — hover lift</div></div>
    <div class="item"><div class="box" style="box-shadow: var(--shadow-lg);"></div><div class="name">lg — modal</div></div>
  </div>
</body>
</html>
