<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Inputs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--color-surface); display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--color-text); }
  input, select { font-family: var(--font-sans); font-size: 15px; padding: 10px 12px; border-radius: var(--radius-md); border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text); transition: all 150ms var(--ease-out-quart); }
  input:focus, select:focus { outline: none; border-color: var(--color-primary); box-shadow: var(--shadow-focus); }
  .search { position: relative; }
  .search input { width: 100%; padding-left: 40px; border-radius: var(--radius-pill); background: var(--color-surface-2); border-color: transparent; box-sizing: border-box; }
  .search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--color-text-muted); }
  .qty { display: inline-flex; align-items: center; border: 1px solid var(--color-border); border-radius: var(--radius-pill); overflow: hidden; }
  .qty button { background: transparent; border: none; width: 36px; height: 36px; font-size: 18px; color: var(--color-text); cursor: pointer; }
  .qty span { padding: 0 14px; font-weight: 600; min-width: 24px; text-align: center; }
</style>
</head>
<body>
  <label>Email
    <input type="email" placeholder="you@example.com" value="maria@home.ph">
  </label>
  <label>Delivery barangay
    <select><option>Brgy. Poblacion, Makati</option></select>
  </label>
  <div>
    <div style="font-size:13px; font-weight:600; margin-bottom:6px;">Search</div>
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input placeholder="Search rice, oil, canned goods…">
    </div>
  </div>
  <div>
    <div style="font-size:13px; font-weight:600; margin-bottom:6px;">Quantity</div>
    <div class="qty"><button>−</button><span>3</span><button>+</button></div>
  </div>
</body>
</html>
