<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--color-surface); }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 80px; height: 80px; background: var(--color-primary-soft); border: 1px solid var(--color-primary); }
  .name { font-size: 12px; font-weight: 600; color: var(--color-text); }
  .px { font-family: ui-monospace, monospace; font-size: 11px; color: var(--color-text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius: var(--radius-sm);"></div><div class="name">sm</div><div class="px">6px</div></div>
    <div class="item"><div class="box" style="border-radius: var(--radius-md);"></div><div class="name">md</div><div class="px">10px</div></div>
    <div class="item"><div class="box" style="border-radius: var(--radius-lg);"></div><div class="name">lg</div><div class="px">16px</div></div>
    <div class="item"><div class="box" style="border-radius: var(--radius-xl);"></div><div class="name">xl</div><div class="px">24px</div></div>
    <div class="item"><div class="box" style="border-radius: var(--radius-2xl);"></div><div class="name">2xl</div><div class="px">32px</div></div>
    <div class="item"><div class="box" style="border-radius: var(--radius-pill); width: 120px; height: 40px;"></div><div class="name">pill</div><div class="px">9999px</div></div>
  </div>
</body>
</html>
