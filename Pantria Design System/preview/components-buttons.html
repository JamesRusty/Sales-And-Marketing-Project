<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--color-surface); display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: var(--radius-md); font-weight: 600; font-size: 15px; border: none; cursor: pointer; transition: all 150ms var(--ease-out-quart); font-family: var(--font-sans); }
  .btn-primary { background: var(--color-primary); color: #fff; }
  .btn-primary:hover { background: var(--color-primary-dark); }
  .btn-secondary { background: var(--color-primary-soft); color: var(--color-primary-darker); }
  .btn-ghost { background: transparent; color: var(--color-text); border: 1px solid var(--color-border); }
  .btn-accent { background: var(--color-accent); color: var(--color-text); }
  .btn-danger { background: var(--color-danger-soft); color: var(--color-danger); }
  .btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
  .btn-lg { padding: 14px 24px; font-size: 16px; }
  .icon { width: 16px; height: 16px; }
  .label { font-size: 11px; font-weight: 600; color: var(--color-text-muted); letter-spacing: 0.06em; text-transform: uppercase; min-width: 90px; }
</style>
</head>
<body>
  <div class="row"><div class="label">Primary</div>
    <button class="btn btn-primary"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>Add to cart</button>
    <button class="btn btn-primary btn-sm">Buy now</button>
    <button class="btn btn-primary btn-lg">Checkout — ₱2,450</button>
  </div>
  <div class="row"><div class="label">Secondary</div>
    <button class="btn btn-secondary">Continue shopping</button>
    <button class="btn btn-ghost">Save for later</button>
    <button class="btn btn-accent">View promo</button>
    <button class="btn btn-danger">Remove</button>
  </div>
  <div class="row"><div class="label">States</div>
    <button class="btn btn-primary" style="background: var(--color-primary-dark);">Hover</button>
    <button class="btn btn-primary" style="transform: scale(0.98); background: var(--color-primary-dark);">Pressed</button>
    <button class="btn btn-primary" style="opacity: 0.5;" disabled>Disabled</button>
    <button class="btn btn-primary" style="box-shadow: var(--shadow-focus);">Focus</button>
  </div>
</body>
</html>
