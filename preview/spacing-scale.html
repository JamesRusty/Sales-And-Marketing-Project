<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--color-surface); }
  .scale { display: flex; align-items: flex-end; gap: 12px; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: var(--color-primary); border-radius: 4px; width: 28px; }
  .label { font-family: ui-monospace, monospace; font-size: 10px; color: var(--color-text-muted); }
  .px { font-size: 11px; font-weight: 600; color: var(--color-text); }
</style>
</head>
<body>
  <div class="scale">
    <div class="step"><div class="bar" style="height: 4px;"></div><div class="px">4</div><div class="label">--space-1</div></div>
    <div class="step"><div class="bar" style="height: 8px;"></div><div class="px">8</div><div class="label">--space-2</div></div>
    <div class="step"><div class="bar" style="height: 12px;"></div><div class="px">12</div><div class="label">--space-3</div></div>
    <div class="step"><div class="bar" style="height: 16px;"></div><div class="px">16</div><div class="label">--space-4</div></div>
    <div class="step"><div class="bar" style="height: 20px;"></div><div class="px">20</div><div class="label">--space-5</div></div>
    <div class="step"><div class="bar" style="height: 24px;"></div><div class="px">24</div><div class="label">--space-6</div></div>
    <div class="step"><div class="bar" style="height: 32px;"></div><div class="px">32</div><div class="label">--space-7</div></div>
    <div class="step"><div class="bar" style="height: 40px;"></div><div class="px">40</div><div class="label">--space-8</div></div>
    <div class="step"><div class="bar" style="height: 48px;"></div><div class="px">48</div><div class="label">--space-9</div></div>
    <div class="step"><div class="bar" style="height: 64px;"></div><div class="px">64</div><div class="label">--space-10</div></div>
    <div class="step"><div class="bar" style="height: 80px;"></div><div class="px">80</div><div class="label">--space-11</div></div>
    <div class="step"><div class="bar" style="height: 96px;"></div><div class="px">96</div><div class="label">--space-12</div></div>
  </div>
</body>
</html>
