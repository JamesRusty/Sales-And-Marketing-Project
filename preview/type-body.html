<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Type — Body</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px 28px; background: var(--color-surface); display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; }
  .meta { font-family: ui-monospace, monospace; font-size: 11px; color: var(--color-text-muted); white-space: nowrap; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-muted); }
</style>
</head>
<body>
  <div class="row"><div style="font-size: 28px; font-weight: 600;">Shop by category</div><div class="meta">28 / 600 — h3</div></div>
  <div class="row"><div style="font-size: 20px; font-weight: 600;">Premium jasmine rice, 25 kg</div><div class="meta">20 / 600 — h5</div></div>
  <div class="row"><div style="font-size: 16px; font-weight: 400; color: var(--color-text);">Free delivery within Metro Manila on orders over ₱2,000.</div><div class="meta">16 / 400 — body</div></div>
  <div class="row"><div style="font-size: 13px; font-weight: 400; color: var(--color-text-muted);">Restocks every Monday and Thursday.</div><div class="meta">13 / 400 — small</div></div>
  <div class="row"><div class="eyebrow">Best sellers · This week</div><div class="meta">12 / 600 / 0.08 — eyebrow</div></div>
</body>
</html>
